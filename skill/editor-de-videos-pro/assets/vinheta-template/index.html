<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Vinheta de abertura</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "MarcaFonte";
        src: url("assets/fonts/marca.ttf") format("truetype");
        font-weight: 200 800;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "MarcaFonte", sans-serif;
      }
      #wipe {
        position: absolute;
        inset: 0;
      }
      #wipe-edge {
        position: absolute;
        inset: 0;
        background: {{COR_DESTAQUE}};
      }
      #wipe-panel {
        position: absolute;
        inset: 0;
        background: {{COR_ESCURA}};
      }
      #card {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-left: 180px;
      }
      #pill {
        align-self: flex-start;
        background: {{COR_DESTAQUE}};
        color: {{COR_ESCURA}};
        font-weight: 700;
        font-size: 34px;
        padding: 12px 30px;
        border-radius: 999px;
        margin-bottom: 34px;
      }
      #title {
        color: {{COR_CLARA}};
        font-weight: 800;
        font-size: 150px;
        line-height: 1;
        letter-spacing: -0.03em;
      }
      #title .acc { color: {{COR_DESTAQUE}}; display: block; }
      #rule {
        width: 520px;
        height: 6px;
        background: {{COR_DESTAQUE}};
        margin-top: 44px;
        transform-origin: left center;
      }
      #brand {
        position: absolute;
        left: 180px;
        bottom: 90px;
        color: {{COR_DESTAQUE}};
        font-weight: 600;
        font-size: 30px;
        letter-spacing: 0.04em;
      }
      #sub {
        color: {{COR_CLARA}};
        opacity: 0.75;
        font-weight: 500;
        font-size: 40px;
        margin-top: 26px;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-h98m" id="root" data-composition-id="main" data-start="0" data-duration="3.6" data-width="1920" data-height="1080">
      <div data-hf-id="hf-w0n9" id="wipe" class="clip" data-start="0" data-duration="3.6" data-track-index="0">
        <div data-hf-id="hf-elht" id="wipe-edge" data-layout-allow-overflow=""></div>
        <div data-hf-id="hf-i9eo" id="wipe-panel" data-layout-allow-overflow=""></div>
        <div data-hf-id="hf-55rf" id="card">
          <div data-hf-id="hf-ds2j" id="pill">{{SELO}}</div>
          <div data-hf-id="hf-fvf4" id="title">{{TITULO}} <span data-hf-id="hf-ltsi" class="acc">{{DESTAQUE}}</span></div>
          <div data-hf-id="hf-8e4z" id="rule"></div>
          <div data-hf-id="hf-wdea" id="sub">{{SUB}}</div>
          <div id="brand">{{ASSINATURA}}</div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // painel já cobre a tela desde o primeiro frame
      tl.set("#wipe-edge", { xPercent: 0 }, 0);
      tl.set("#wipe-panel", { xPercent: 0 }, 0);
      // conteúdo
      tl.fromTo("#pill", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.25);
      tl.fromTo("#title", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.35);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, 0.6);
      tl.fromTo("#sub", { y: 20, opacity: 0 }, { y: 0, opacity: 0.75, duration: 0.4, ease: "power2.out" }, 0.75);
      tl.fromTo("#brand", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.9);
      // saída do conteúdo
      tl.to("#card", { x: 80, opacity: 0, duration: 0.3, ease: "power2.in" }, 2.85);
      // saída: painel e faixa saem pela direita revelando a aula
      tl.to("#wipe-panel", { xPercent: 100, duration: 0.45, ease: "power3.inOut" }, 3.1);
      tl.to("#wipe-edge", { xPercent: 100, duration: 0.45, ease: "power3.inOut" }, 3.15);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
